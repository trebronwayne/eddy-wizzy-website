name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the permissions this workflow needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces an older one that is still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build
        env:
          # Correct base path for this repository's Pages URL (empty on user sites / custom domains).
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      # GitHub Pages serves 404.html for unknown paths. Using the app itself as the 404 page
      # lets React Router handle direct links and refreshes such as /music or /booking.
      - name: Add single-page-app fallback
        run: cp dist/index.html dist/404.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Pull requests only run the build above to catch errors. Only main goes live.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
