<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14171a" />
    <meta name="color-scheme" content="dark light" />
    <!-- Runs before first paint: use the saved choice, otherwise the device setting. Prevents a theme flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ew-theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#14171a' : '#e8ecf1');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Official website of Eddy Wizzy, Ugandan recording artist. Music, videos, More Fire Entertainment and bookings." />
